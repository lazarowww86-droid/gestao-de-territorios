<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6750a4">
    <meta name="description" content="Gestão compartilhada de territórios da congregação.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Territórios">
    <title>Gestão de Territórios</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css?v=19">
    <script>
      /*
       * Esta fila precisa existir ANTES de o SDK do OneSignal executar.
       * Como o SDK externo usa "defer", deixar esta configuração no app.js
       * criava uma corrida: o SDK podia carregar primeiro e nunca executar o init.
       */
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.__oneSignalInitError = null;
      window.__oneSignalReady = new Promise((resolve) => {
        let settled = false;
        const finish = (value) => {
          if (settled) return;
          settled = true;
          resolve(value);
        };

        window.__finishOneSignalInit = finish;
        window.OneSignalDeferred.push(async (OneSignal) => {
          try {
            OneSignal.Debug?.setLogLevel?.("warn");
            await OneSignal.init({
              appId: "fb6a7811-19f7-443c-b0e6-4e8456d9502f",
              serviceWorkerPath: "/gestao-de-territorios/push/onesignal/OneSignalSDKWorker.js",
              serviceWorkerParam: {
                scope: "/gestao-de-territorios/push/onesignal/"
              },
              notifyButton: { enable: false },
              welcomeNotification: { disable: true }
            });
            finish(OneSignal);
          } catch (error) {
            console.error("Falha ao iniciar o OneSignal", error);
            window.__oneSignalInitError = error;
            finish(null);
          }
        });
      });

      window.__oneSignalScriptError = () => {
        const error = new Error("O navegador bloqueou o carregamento do OneSignal. Desative o bloqueador de anúncios ou a proteção antirrastreamento para este site e recarregue a página.");
        window.__oneSignalInitError = error;
        window.__finishOneSignalInit?.(null);
      };
    </script>
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
      onerror="window.__oneSignalScriptError()"
    ></script>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o Gestão de Territórios.</noscript>
    <div id="network-banner" class="network-banner" role="status" hidden>Sem internet — as alterações serão sincronizadas quando a conexão voltar.</div>
    <main id="app" class="app-root" aria-live="polite">
      <section class="loading-screen" aria-label="Carregando">
        <span class="spinner" aria-hidden="true"></span>
      </section>
    </main>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./app.js?v=19"></script>
  </body>
</html>
